name: Publikacja GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz stronę
        uses: actions/checkout@v4
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Przygotuj pliki
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Opublikuj
        id: deployment
        uses: actions/deploy-pages@v4
